<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Nosso Álbum ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
/* Estilos unificados */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:#fff9fb;color:#555}
.album-inner{max-width:480px;margin:0 auto;padding-bottom:5rem}
.sec-heading{text-align:center;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#f48fb1;margin:1.75rem 0 1.25rem}

/* Estilos de Músicas */
.music-grid{display:flex;flex-direction:column;gap:1.25rem;padding:0 1rem}
.music-card{background:#fff;border-radius:20px;padding:1.5rem;border:1px solid #fce4ec;box-shadow:0 4px 20px rgba(233,30,140,.06);text-align:center}
.music-title{font-family:'Cormorant Garamond',serif;font-size:20px;color:#880e3f;font-weight:600;margin-bottom:4px}
.music-art{font-size:13px;color:#f48fb1;margin-bottom:15px}
.music-dedic{font-family:'Cormorant Garamond',serif;font-size:16px;color:#555;font-style:italic;line-height:1.5;margin-bottom:15px}
.music-btn{display:inline-block;padding:8px 20px;background:#e91e8c;color:#fff;border-radius:20px;text-decoration:none;font-size:13px;font-weight:500}

/* Nota: Os outros estilos originais (contador, quiz, envelope) continuam aqui... */
</style>
</head>
<body>

<!-- ... (O restante do seu HTML original vai aqui) ... -->

<div class="music-section" id="sec-music">
  <div class="sec-heading">✦ nossas músicas especiais ✦</div>
  <div class="music-grid" id="musicGrid"></div>
</div>

<!-- ... (Restante do código) ... -->

<script>
// Lista de Músicas
const DEF_MUSIC = [
  {title: "Certo Alguém", artist: "Lulu Santos", link: "https://youtu.be/4yUQN_UjdtY", dedic: "Dizem que a gente nunca sabe quando o destino vai cruzar o nosso caminho, mas com você foi diferente..."},
  {title: "Mulher Maravilha", artist: "Zé Neto & Cristiano", link: "https://youtu.be/Fzmvv8fSyQs", dedic: "Às vezes eu paro para te observar e penso em como a sorte sorriu para mim..."},
  {title: "Que Sorte a Nossa", artist: "Matheus & Kauan", link: "https://youtu.be/BkpqU3gdjlw", dedic: "Sabe aquela música que a gente ouve e parece que foi escrita para nós?..."},
  {title: "Pra Sempre Com Você", artist: "Jorge & Mateus", link: "https://youtu.be/VWRkQARH-9o", dedic: "Olhando para os nossos dois anos de história, percebo que cada momento..."},
  {title: "Na Hora da Raiva", artist: "Jorge & Mateus", link: "https://youtu.be/X8jD3F9PI7Q", dedic: "Entre os desentendimentos e as certezas, a maior delas é que eu sempre vou te escolher..."}
];

function renderMusic(){
  const g=document.getElementById('musicGrid');
  g.innerHTML = DEF_MUSIC.map(m => `
    <div class="music-card">
      <div class="music-title">${m.title}</div>
      <div class="music-art">${m.artist}</div>
      <div class="music-dedic">${m.dedic}</div>
      <a href="${m.link}" target="_blank" class="music-btn">Ouvir agora</a>
    </div>
  `).join('');
}

// Chame renderMusic() dentro do seu window.onload original
window.onload = () => {
    load();
    spawnPetals();
    renderTimeline();
    renderQuiz();
    renderMusic(); // <--- Adicionado aqui
};
</script>
</body>
</html>
