<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>Nosso Álbum ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;height:100%;overflow:hidden;background:#0d0008;color:#fff}
/* ── PAGES ── */
.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease,transform .6s ease;overflow:hidden}
.page.hidden{opacity:0;pointer-events:none;transform:scale(1.04)}
/* ── INTRO / ENVELOPE ── */
#intro{background:radial-gradient(ellipse at 30% 40%,#3d001e 0%,#0d0008 70%);z-index:10}
.petals-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.petal{position:absolute;font-size:18px;animation:fall linear infinite;opacity:0}
@keyframes fall{0%{opacity:0;transform:translateY(-30px) rotate(0deg)}10%{opacity:.7}90%{opacity:.5}100%{opacity:0;transform:translateY(110vh) rotate(720deg)}}
.envelope-wrap{position:relative;cursor:pointer;user-select:none}
.envelope{width:220px;height:160px;position:relative;animation:floatEnv 3s ease-in-out infinite}
@keyframes floatEnv{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.env-body{width:220px;height:160px;background:linear-gradient(160deg,#a50047,#7b0033);border-radius:8px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.env-body::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.08),transparent)}
.env-flap{position:absolute;top:0;left:0;right:0;height:80px;background:linear-gradient(160deg,#c2185b,#880e3f);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .8s cubic-bezier(.25,.46,.45,.94)}
.envelope-wrap.open .env-flap{transform:rotateX(180deg)}
.env-left{position:absolute;bottom:0;left:0;width:50%;height:90px;background:linear-gradient(135deg,#8b0038,#6a0028);clip-path:polygon(0 100%,100% 100%,100% 0)}
.env-right{position:absolute;bottom:0;right:0;width:50%;height:90px;background:linear-gradient(225deg,#7b0033,#5c0020);clip-path:polygon(0 100%,0 0,100% 100%)}
.env-heart{position:absolute;top:50%;left:50%;transform:translate(-50%,-30%);font-size:32px;animation:pulse 1.5s ease-in-out infinite}
.env-card{position:absolute;width:190px;height:130px;background:linear-gradient(135deg,#fff0f5,#fff);border-radius:6px;top:10px;left:15px;display:flex;align-items:center;justify-content:center;transition:transform .8s cubic-bezier(.25,.46,.45,.94);z-index:1}
.envelope-wrap.open .env-card{transform:translateY(-110px)}
.env-card-text{text-align:center;color:#c2185b;font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;line-height:1.5;padding:10px}
.intro-hint{margin-top:28px;font-size:13px;color:rgba(255,255,255,.45);letter-spacing:1.5px;text-transform:uppercase;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:.9}}
/* ── MAIN ALBUM ── */
#album{background:#fff9fb;z-index:5;opacity:0;pointer-events:none;display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;align-items:flex-start;justify-content:flex-start}
#album.show{opacity:1;pointer-events:auto}
.album-inner{max-width:480px;margin:0 auto;padding:0 0 5rem}
/* ── COVER ── */
.cover{text-align:center;padding:3rem 1.5rem 1.5rem;background:linear-gradient(180deg,#fff0f5 0%,#fff9fb 100%)}
.cover-hearts{font-size:22px;letter-spacing:12px;color:#e91e8c;animation:pulse 2s ease-in-out infinite;margin-bottom:1rem;display:block}
.cover-title{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:500;color:#880e3f;line-height:1.15;margin-bottom:.35rem}
.cover-sub{font-size:12px;color:#bbb;letter-spacing:2px;text-transform:uppercase}
/* ── COUNTER ── */
.counter{margin:1.25rem 1rem;background:#fff;border:1px solid #fce4ec;border-radius:20px;padding:1.25rem 1rem;text-align:center;box-shadow:0 4px 24px rgba(233,30,140,.06)}
.ctr-label{font-size:11px;letter-spacing:2px;color:#f48fb1;text-transform:uppercase;margin-bottom:1rem}
.ctr-grid{display:flex;justify-content:center;gap:8px}
.c-item{flex:1;max-width:72px;background:#fff0f5;border-radius:12px;padding:10px 4px 8px}
.c-num{display:block;font-family:'Cormorant Garamond',serif;font-size:30px;color:#880e3f;line-height:1}
.c-unit{display:block;font-size:10px;color:#f48fb1;margin-top:3px;letter-spacing:.5px}
.ctr-since{font-size:11px;color:#ccc;margin-top:10px}
/* ── TIMELINE ── */
.timeline-section{padding:0 1rem;margin-bottom:.5rem}
.sec-heading{text-align:center;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#f48fb1;margin:1.75rem 0 1.25rem}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,#fce4ec,#f48fb1,#fce
